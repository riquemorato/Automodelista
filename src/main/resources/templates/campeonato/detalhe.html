<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title th:text="${campeonato.nome}">Campeonato</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container py-4">

  <h2 th:text="${campeonato.nome}"></h2>
  <p class="text-muted" th:text="'Temporada ' + ${campeonato.temporada}"></p>

  <div class="row g-4">
    <!-- Corridas -->
    <div class="col-md-7">
      <div class="card shadow-sm mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
          <strong>Corridas</strong>
        </div>
        <table class="table table-hover mb-0">
          <thead class="table-light"><tr><th>Rd</th><th>Nome</th><th>Circuito</th><th>Status</th><th></th></tr></thead>
          <tbody>
            <tr th:each="c : ${corridas}">
              <td th:text="${c.rodada}"></td>
              <td th:text="${c.nome}"></td>
              <td th:text="${c.circuito}"></td>
              <td>
                <span class="badge"
                  th:classappend="${c.status.name() == 'FINALIZADA'} ? 'bg-success' : (${c.status.name() == 'EM_ANDAMENTO'} ? 'bg-warning text-dark' : 'bg-secondary')"
                  th:text="${c.status.descricao}"></span>
              </td>
              <td><a th:href="@{/corridas/{id}(id=${c.id})}" class="btn btn-sm btn-outline-primary">Abrir</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(corridas)}">
              <td colspan="5" class="text-muted text-center">Nenhuma corrida criada.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Form nova corrida -->
      <div class="card shadow-sm">
        <div class="card-header"><strong>Nova Corrida</strong></div>
        <div class="card-body">
          <form th:action="@{/campeonatos/{id}/corridas/nova(id=${campeonato.id})}" method="post">
            <div class="row g-2">
              <div class="col-12">
                <input type="text" name="nome" class="form-control" placeholder="Nome da corrida *" required>
              </div>
              <div class="col-8">
                <input type="text" name="circuito" class="form-control" placeholder="Circuito">
              </div>
              <div class="col-4">
                <input type="number" name="rodada" class="form-control" placeholder="Rd *" required>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary w-100">Criar Corrida</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Standings -->
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-header"><strong>🏆 Classificação</strong></div>
        <table class="table table-sm mb-0">
          <thead class="table-light"><tr><th>Pos</th><th>Piloto</th><th>Pts</th><th>Gap</th></tr></thead>
          <tbody>
            <tr th:each="s : ${standings}">
              <td th:text="${s.posicao()}"></td>
              <td th:text="${s.nomePiloto()}"></td>
              <td><strong th:text="${s.pontos()}"></strong></td>
              <td class="text-muted" th:text="${s.isLider()} ? 'LÍDER' : '-' + ${s.gapParaLider()}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(standings)}">
              <td colspan="4" class="text-muted text-center">Sem dados.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <a th:href="@{/campeonatos}" class="btn btn-link btn-sm mt-3">← Campeonatos</a>
</div></body></html>
