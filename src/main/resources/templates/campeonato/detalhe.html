<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title th:text="${campeonato.nome} + ' — Automodelista'">Campeonato</title>
  <th:block th:replace="~{fragments/layout :: head-assets}"></th:block>
</head>
<body>

<header th:replace="~{fragments/layout :: topbar}"></header>
<th:block th:replace="~{fragments/layout :: sidebar}"></th:block>

<main class="main">

  <div class="page-header">
    <div>
      <h1 class="page-title" th:text="${campeonato.nome}"></h1>
      <p class="page-subtitle" th:text="'Temporada ' + ${campeonato.temporada}"></p>
    </div>
    <a th:href="@{/standings(campeonatoId=${campeonato.id})}" class="btn btn-outline-secondary">🏆 Ver classificação completa</a>
  </div>

  <div class="corrida-grid">

    <div class="card card--scroll-lg">
      <div class="card-header">Corridas</div>
      <div class="card-body scroll-y">
        <table class="table table-sm mb-0">
          <thead><tr><th>Rd</th><th>Nome</th><th>Circuito</th><th>Status</th><th></th></tr></thead>
          <tbody>
            <tr th:each="c : ${corridas}">
              <td class="num" th:text="${c.rodada}"></td>
              <td th:text="${c.nome}"></td>
              <td class="text-muted" th:text="${c.circuito}"></td>
              <td>
                <span class="badge"
                  th:classappend="${c.status.name() == 'FINALIZADA'} ? 'bg-success' : (${c.status.name() == 'EM_ANDAMENTO'} ? 'bg-warning' : 'bg-secondary')"
                  th:text="${c.status.descricao}"></span>
              </td>
              <td><a th:href="@{/corridas/{id}(id=${c.id})}" class="btn btn-sm btn-outline-secondary">Abrir</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(corridas)}">
              <td colspan="5" class="text-muted text-center py-3">Nenhuma corrida criada.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="corrida-side">

      <div class="hero-card" th:if="${proximaCorrida}">
        <div>
          <div class="hero-card__eyebrow">Próxima corrida — Rodada <span th:text="${proximaCorrida.rodada}"></span></div>
          <h2 class="hero-card__title" th:text="${proximaCorrida.nome}"></h2>
          <div class="hero-card__sub" th:text="${proximaCorrida.circuito}"></div>
        </div>
      <div class="hero-card__actions">
        <span class="badge"
          th:classappend="${proximaCorrida.status.name() == 'EM_ANDAMENTO'} ? 'bg-warning' : 'bg-secondary'"
          th:text="${proximaCorrida.status.descricao}"></span>
        <a th:href="@{/corridas/{id}(id=${proximaCorrida.id})}" class="btn btn-primary">Abrir corrida</a>
      </div>
    </div>

  <div class="card">
    <div class="card-header">Nova Corrida</div>
    <!-- ... resto do card "Nova Corrida", sem alteração ... -->
      <div class="card">
        <div class="card-header">Nova Corrida</div>
        <div class="card-body">
          <form th:action="@{/campeonatos/{id}/corridas/nova(id=${campeonato.id})}" method="post">
            <div class="mb-2">
              <label class="form-label">Nome</label>
              <input type="text" name="nome" class="form-control" placeholder="Nome da corrida" required>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-8">
                <label class="form-label">Circuito</label>
                <input type="text" name="circuito" class="form-control" placeholder="Circuito">
              </div>
              <div class="col-4">
                <label class="form-label">Rodada</label>
                <input type="number" name="rodada" class="form-control" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Criar Corrida</button>
          </form>
        </div>
      </div>
    </div>

  </div>

</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
