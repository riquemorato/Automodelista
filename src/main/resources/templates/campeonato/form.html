<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Novo Campeonato</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container py-4" style="max-width:420px">
  <h2 class="mb-3">Novo Campeonato</h2>
  <form th:action="@{/campeonatos/novo}" th:object="${campeonato}" method="post" class="card p-4 bg-white shadow-sm">
    <div class="mb-3">
      <label class="form-label">Nome</label>
      <input type="text" th:field="*{nome}" class="form-control" placeholder="Ex: Formula Apex 2024" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Temporada (ano)</label>
      <input type="number" th:field="*{temporada}" class="form-control" placeholder="2024" required>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Salvar</button>
      <a th:href="@{/campeonatos}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div></body></html>
