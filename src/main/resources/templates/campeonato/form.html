<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Automodelista — Novo Campeonato</title>
  <th:block th:replace="~{fragments/layout :: head-assets}"></th:block>
</head>
<body>

<header th:replace="~{fragments/layout :: topbar}"></header>
<th:block th:replace="~{fragments/layout :: sidebar}"></th:block>

<main class="main">

  <div class="page-header">
    <div><h1 class="page-title">Novo Campeonato</h1></div>
  </div>

  <div class="card" style="max-width:480px">
    <div class="card-body">
      <form th:action="@{/campeonatos/novo}" th:object="${campeonato}" method="post">
        <div class="mb-3">
          <label class="form-label">Nome</label>
          <input type="text" th:field="*{nome}" class="form-control" placeholder="Ex: Fórmula 1 World Championship" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Temporada (ano)</label>
          <input type="number" th:field="*{temporada}" class="form-control" placeholder="2026" required>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Salvar</button>
          <a th:href="@{/campeonatos}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>

</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
