<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Campeonatos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Campeonatos</h2>
    <a th:href="@{/campeonatos/novo}" class="btn btn-primary btn-sm">+ Novo Campeonato</a>
  </div>
  <div class="row g-3">
    <div class="col-md-4" th:each="c : ${campeonatos}">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title" th:text="${c.nome}"></h5>
          <p class="card-text text-muted" th:text="'Temporada ' + ${c.temporada}"></p>
          <a th:href="@{/campeonatos/{id}(id=${c.id})}" class="btn btn-outline-primary btn-sm">Ver detalhes</a>
        </div>
      </div>
    </div>
  </div>
  <div th:if="${#lists.isEmpty(campeonatos)}" class="alert alert-info mt-3">Nenhum campeonato cadastrado.</div>
  <a th:href="@{/}" class="btn btn-link btn-sm mt-3">← Início</a>
</div></body></html>
