<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Automodelista — Campeonatos</title>
  <th:block th:replace="~{fragments/layout :: head-assets}"></th:block>
</head>
<body>

<header th:replace="~{fragments/layout :: topbar}"></header>
<th:block th:replace="~{fragments/layout :: sidebar}"></th:block>

<main class="main">

  <div class="page-header">
    <div>
      <h1 class="page-title">Campeonatos</h1>
      <p class="page-subtitle">Temporadas cadastradas no sistema.</p>
    </div>
    <a th:href="@{/campeonatos/novo}" class="btn btn-primary">+ Novo Campeonato</a>
  </div>

  <div class="row g-3">
    <div class="col-md-4" th:each="c : ${campeonatos}">
      <div class="card h-100">
        <div class="card-body">
          <h5 th:text="${c.nome}"></h5>
          <p class="text-muted" th:text="'Temporada ' + ${c.temporada}"></p>
          <a th:href="@{/campeonatos/{id}(id=${c.id})}" class="btn btn-sm btn-outline-secondary">Ver detalhes</a>
        </div>
      </div>
    </div>
  </div>

  <div th:if="${#lists.isEmpty(campeonatos)}" class="alert alert-warning mt-3">Nenhum campeonato cadastrado.</div>

</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
