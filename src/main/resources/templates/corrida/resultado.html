<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title th:text="'Resultado — ' + ${corrida.nome}">Resultado</title>
  <th:block th:replace="~{fragments/layout :: head-assets}"></th:block>
</head>
<body>

<header th:replace="~{fragments/layout :: topbar-resultado(${corrida.id})}"></header>
<th:block th:replace="~{fragments/layout :: sidebar}"></th:block>

<main class="main">

  <div class="page-header">
    <div>
      <h1 class="page-title">🏁 Resultado da Corrida</h1>
      <p class="page-subtitle" th:text="${corrida.nome} + ' — ' + ${corrida.circuito}"></p>
    </div>
  </div>

  <div class="card card--scroll-lg">
    <div class="card-body scroll-y">
      <table class="table table-sm mb-0">
        <thead>
          <tr><th>Pos</th><th>Piloto</th><th class="num">Score</th><th class="num">Pontos</th><th>Status</th></tr>
        </thead>
        <tbody>
          <tr th:each="r : ${resultados}" th:classappend="${r.foiPodio()} ? 'row-podio' : ''">
            <td class="num">
              <span th:if="${r.posicao() == 1}">🥇</span>
              <span th:if="${r.posicao() == 2}">🥈</span>
              <span th:if="${r.posicao() == 3}">🥉</span>
              <strong th:text="'P' + ${r.posicao()}"></strong>
            </td>
            <td th:text="${r.piloto().getNome()}"></td>
            <td class="num" th:text="${r.score()}"></td>
            <td class="num">
              <strong class="text-success" th:if="${r.pontuou()}" th:text="${r.pontosObtidos()}"></strong>
              <span class="text-muted" th:unless="${r.pontuou()}">—</span>
            </td>
            <td>
              <span th:if="${r.abandonou()}" class="badge bg-danger">DNF</span>
              <span th:unless="${r.abandonou()}" class="badge bg-success">Finalizado</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="alert alert-info mt-3">
    <strong>Como ler o Score:</strong> Score = habilidade × consistência (piloto) + performance do carro + bônus da estratégia ± variação aleatória.
    Maior score = melhor posição. DNF ocorre por probabilidade proporcional ao risco da estratégia.
  </div>

</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
