<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Automodelista — Editar Equipe</title>
  <th:block th:replace="~{fragments/layout :: head-assets}"></th:block>
</head>
<body>

<header th:replace="~{fragments/layout :: topbar}"></header>
<th:block th:replace="~{fragments/layout :: sidebar}"></th:block>

<main class="main">

  <div class="page-header">
    <div>
      <h1 class="page-title">Editar Equipe</h1>
      <p class="page-subtitle" th:text="${equipe.nome}"></p>
    </div>
  </div>
  
  <!-- Alerta de registro duplicado-->
  <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

  <div class="card" style="max-width:520px">
    <div class="card-body">
      <form th:action="@{/equipes/{id}/editar(id=${id})}" th:object="${equipe}" method="post">

        <div class="mb-3">
          <label class="form-label">Nome da equipe</label>
          <input type="text" th:field="*{nome}" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Orçamento (R$)</label>
          <input type="text" id="orcamentoDisplay" class="form-control" inputmode="numeric" required>
          <input type="hidden" th:field="*{orcamento}">
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Atualizar</button>
          <a th:href="@{/equipes}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>

</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

<script>
  (function () {
    const display = document.getElementById('orcamentoDisplay');
    const hidden  = document.getElementById('orcamento');

    const valorInicial = parseFloat(hidden.value || '0');
    if (valorInicial > 0) {
      display.value = Math.round(valorInicial).toLocaleString('pt-BR');
    }

    display.addEventListener('input', () => {
      const digitos = display.value.replace(/\D/g, '');
      hidden.value = digitos || '0';
      display.value = digitos ? Number(digitos).toLocaleString('pt-BR') : '';
    });
  })();
</script>

</body>
</html>
