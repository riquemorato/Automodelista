<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Nova Equipe</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container py-4" style="max-width:480px">
  <h2 class="mb-3">Nova Equipe</h2>
  <form th:action="@{/equipes/nova}" th:object="${equipe}" method="post" class="card p-4 bg-white shadow-sm">
    <div class="mb-3">
      <label class="form-label">Nome</label>
      <input type="text" th:field="*{nome}" class="form-control" placeholder="Ex: Apex Racing" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Orçamento (R$)</label>
      <input type="number" th:field="*{orcamento}" class="form-control" placeholder="Ex: 10000000" step="any" min="0" required>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Salvar</button>
      <a th:href="@{/equipes}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div></body></html>
