<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Equipes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Equipes</h2>
    <a th:href="@{/equipes/nova}" class="btn btn-primary btn-sm">+ Nova Equipe</a>
  </div>
  <table class="table table-bordered table-hover bg-white">
    <thead class="table-dark"><tr><th>#</th><th>Nome</th><th>Orçamento</th><th>Ações</th></tr></thead>
    <tbody>
      <tr th:each="e : ${equipes}">
        <td th:text="${e.id}"></td>
        <td th:text="${e.nome}"></td>
        <td th:text="'R$ ' + ${#numbers.formatDecimal(e.orcamento,1,'POINT',2,'COMMA')}"></td>
        <td><a th:href="@{/equipes/{id}/editar(id=${e.id})}" class="btn btn-sm btn-outline-secondary">Editar</a></td>
      </tr>
    </tbody>
  </table>
  <a th:href="@{/}" class="btn btn-link btn-sm">← Início</a>
</div></body></html>
