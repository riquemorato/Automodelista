<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Automodelista — Equipes</title>
  <th:block th:replace="~{fragments/layout :: head-assets}"></th:block>
</head>
<body>

<header th:replace="~{fragments/layout :: topbar}"></header>
<th:block th:replace="~{fragments/layout :: sidebar}"></th:block>

<main class="main">

  <div class="page-header">
    <div>
      <h1 class="page-title">Equipes</h1>
      <p class="page-subtitle">Equipes cadastradas e equipes de referência do campeonato.</p>
    </div>
    <a th:href="@{/equipes/nova}" class="btn btn-primary">+ Nova Equipe</a>
  </div>

  <div class="alert alert-warning" th:if="${param.bloqueado}">
    Esta equipe faz parte dos dados de referência do campeonato e não pode ser editada.
  </div>

  <div class="card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-sm mb-0">
          <thead>
            <tr><th>Nome</th><th class="num">Orçamento</th><th></th></tr>
          </thead>
          <tbody>
            <tr th:each="e : ${equipes}">
              <td th:text="${e.nome}"></td>
              <td class="num" th:text="'R$ ' + ${#numbers.formatDecimal(e.orcamento,1,'POINT',2,'COMMA')}"></td>
              <td>
                <a th:if="${!e.bloqueada}" th:href="@{/equipes/{id}/editar(id=${e.id})}" class="btn btn-sm btn-outline-secondary">Editar</a>
                <span th:if="${e.bloqueada}" class="badge badge--locked">🔒 Referência</span>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(equipes)}">
              <td colspan="3" class="text-muted text-center py-3">Nenhuma equipe cadastrada.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
