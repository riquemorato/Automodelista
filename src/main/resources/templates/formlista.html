<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista Clientes</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
    <table class="table table-striped table-primary">
    	<thead class="ttop">
        	<tr class="table-info">
            	<td><b> ID</b></td>
            	<td><b>NOME</b> </td>
            	<td><b>CPF</b> </td>
            	

				
        	</tr>
    	</thead>
    	<tbody>
        	<tr th:each="cli : ${clientes}">
            	<td th:text="${cli.id}"></td>
            	<td th:text="${cli.nome}"></td>
            	<td th:text="${cli.cpf}"></td>
				<td>
					<a th:href="'/clientes/' + ${cli.id} + '/atualizar/">Editar</a>
				</td>
            	<td>
            		<a th:href="@{'upd/' + ${cli.id}}">
            			Editar
            		</a>
            	</td>
            	<td> 
            		<form th:action="@{'apagar/cliente/' + ${cli.id}}" method=post>
            			<input type="submit" value="X">
            		</form>
            	</td>
       		</tr>
     	</tbody>
    </table>
</body>
</html>
