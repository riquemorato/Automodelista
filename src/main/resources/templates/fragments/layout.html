<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>fragments</title></head>
<body>

<!-- ============================================================
     HEAD ASSETS — fontes, css, viewport
     ============================================================ -->
<th:block th:fragment="head-assets">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/theme.css}">
</th:block>

<!-- ============================================================
     LOGO — clicável, volta para o dashboard
     ============================================================ -->
<a th:fragment="logo" th:href="@{/}" class="brand">
  <svg class="brand__mark" width="28" height="28" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect width="32" height="32" rx="6" fill="#1c212a"/>
    <g fill="#e2241a">
      <rect x="0" y="0" width="8" height="8"/>
      <rect x="16" y="0" width="8" height="8"/>
      <rect x="8" y="8" width="8" height="8"/>
      <rect x="24" y="8" width="8" height="8"/>
      <rect x="0" y="16" width="8" height="8"/>
      <rect x="16" y="16" width="8" height="8"/>
      <rect x="8" y="24" width="8" height="8"/>
      <rect x="24" y="24" width="8" height="8"/>
    </g>
  </svg>
  <span class="brand__text"><strong>APEX</strong> MOTORSPORT</span>
</a>

<!-- ============================================================
     TOPBAR — padrão (Dashboard + Painel Admin)
     ============================================================ -->
<header th:fragment="topbar" class="topbar">
  <button class="sidebar-toggle" type="button" aria-label="Abrir menu" onclick="toggleSidebar()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M3 6h18M3 12h18M3 18h18"/>
    </svg>
  </button>
  <nav class="topbar__nav">
    <a th:href="@{/}" class="btn btn-sm btn-outline-secondary">Dashboard</a>
    <a th:href="@{/admin}" class="btn btn-sm btn-outline-danger">Painel Admin</a>
  </nav>
  <div class="topbar__spacer"></div>
  <a th:replace="~{fragments/layout :: logo}"></a>
</header>

<!-- ============================================================
     TOPBAR — variante para corrida/resultado
     ============================================================ -->
<header th:fragment="topbar-resultado(corridaId)" class="topbar">
  <button class="sidebar-toggle" type="button" aria-label="Abrir menu" onclick="toggleSidebar()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M3 6h18M3 12h18M3 18h18"/>
    </svg>
  </button>
  <nav class="topbar__nav">
    <a th:href="@{/corridas/{id}(id=${corridaId})}" class="btn btn-sm btn-outline-secondary">&larr; Voltar à corrida</a>
    <a th:href="@{/campeonatos}" class="btn btn-sm btn-outline-secondary">Ver Campeonatos</a>
    <a th:href="@{/standings}" class="btn btn-sm btn-outline-secondary">Ver Standings</a>
  </nav>
  <div class="topbar__spacer"></div>
  <a th:replace="~{fragments/layout :: logo}"></a>
</header>

<!-- ============================================================
     SIDEBAR — Campeonatos / Standings / Pilotos / Equipes
     ============================================================ -->
<th:block th:fragment="sidebar">
  <div class="sidebar-backdrop" onclick="toggleSidebar()"></div>
  <aside class="sidebar">
    <nav class="sidebar__nav">

      <a th:href="@{/campeonatos}" class="sidebar__link"
         th:classappend="${#httpServletRequest.requestURI.startsWith('/campeonatos')} ? ' active' : ''">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 22V4a1 1 0 0 1 1-1h11l-1 4 1 4H6"/>
        </svg>
        Campeonatos
      </a>

      <a th:href="@{/standings}" class="sidebar__link"
         th:classappend="${#httpServletRequest.requestURI.startsWith('/standings')} ? ' active' : ''">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16v-7"/>
        </svg>
        Classificação
      </a>

      <a th:href="@{/pilotos}" class="sidebar__link"
         th:classappend="${#httpServletRequest.requestURI.startsWith('/pilotos')} ? ' active' : ''">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>
        </svg>
        Pilotos
      </a>

      <a th:href="@{/equipes}" class="sidebar__link"
         th:classappend="${#httpServletRequest.requestURI.startsWith('/equipes')} ? ' active' : ''">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        Equipes
      </a>

    </nav>
  </aside>
</th:block>

<!-- ============================================================
     SCRIPTS
     ============================================================ -->
<th:block th:fragment="scripts">
  <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
