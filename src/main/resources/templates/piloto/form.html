<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Novo Piloto</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container py-4" style="max-width:520px">
  <h2 class="mb-3">Novo Piloto</h2>
  <form th:action="@{/pilotos/novo}" th:object="${piloto}" method="post" class="card p-4 bg-white shadow-sm">
    <div class="row g-3">
      <div class="col-8">
        <label class="form-label">Nome completo</label>
        <input type="text" th:field="*{nome}" class="form-control" placeholder="Ex: Alex Hartmann" required>
      </div>
      <div class="col-4">
        <label class="form-label">Nº do carro</label>
        <input type="number" th:field="*{numeroCarro}" class="form-control" placeholder="14" required>
      </div>
      <div class="col-6">
        <label class="form-label">Nacionalidade</label>
        <input type="text" th:field="*{nacionalidade}" class="form-control" placeholder="Ex: Brasil">
      </div>
      <div class="col-6">
        <label class="form-label">Idade</label>
        <input type="number" th:field="*{idade}" class="form-control" placeholder="25">
      </div>
      <div class="col-6">
        <label class="form-label">Habilidade (0–100)</label>
        <input type="number" th:field="*{habilidade}" class="form-control" min="0" max="100" required>
        <div class="form-text">Velocidade pura do piloto</div>
      </div>
      <div class="col-6">
        <label class="form-label">Consistência (0–100)</label>
        <input type="number" th:field="*{consistencia}" class="form-control" min="0" max="100" required>
        <div class="form-text">Regularidade ao longo da corrida</div>
      </div>
      <div class="col-12">
        <label class="form-label">Equipe</label>
        <select th:field="*{equipeId}" class="form-select">
          <option value="0">— Sem equipe —</option>
          <option th:each="e : ${equipes}" th:value="${e.id}" th:text="${e.nome}"></option>
        </select>
      </div>
    </div>
    <div class="d-flex gap-2 mt-3">
      <button type="submit" class="btn btn-primary">Salvar</button>
      <a th:href="@{/pilotos}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div></body></html>
