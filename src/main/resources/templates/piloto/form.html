<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Automodelista — Novo Piloto</title>
  <th:block th:replace="~{fragments/layout :: head-assets}"></th:block>
</head>
<body>

<header th:replace="~{fragments/layout :: topbar}"></header>
<th:block th:replace="~{fragments/layout :: sidebar}"></th:block>

<main class="main">

  <div class="page-header">
    <div>
      <h1 class="page-title">Novo Piloto</h1>
      <p class="page-subtitle">Cadastre o piloto que vai representar sua equipe.</p>
    </div>
  </div>

  <div class="card" style="max-width:680px">
    <div class="card-body">
      <form th:action="@{/pilotos/novo}" th:object="${piloto}" method="post">

        <div class="row g-3 mb-1">
          <div class="col-md-8">
            <label class="form-label">Nome completo</label>
            <input type="text" th:field="*{nome}" class="form-control" placeholder="Ex: Alex Hartmann" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Nº do carro</label>
            <input type="number" th:field="*{numeroCarro}" class="form-control" min="0" max="99" required>
          </div>
        </div>

        <div class="row g-3 mb-1">
          <div class="col-md-8">
            <label class="form-label">Nacionalidade</label>
            <input type="text" th:field="*{nacionalidade}" class="form-control" placeholder="Ex: Brasil" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Idade</label>
            <input type="number" th:field="*{idade}" class="form-control" min="16" max="60" required>
          </div>
        </div>

        <div class="row g-3 mb-1">
          <div class="col-md-6">
            <label class="form-label">Habilidade (0–100)</label>
            <input type="number" th:field="*{habilidade}" class="form-control" min="0" max="100" required>
            <div class="form-text text-muted">Velocidade pura do piloto</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Consistência (0–100)</label>
            <input type="number" th:field="*{consistencia}" class="form-control" min="0" max="100" required>
            <div class="form-text text-muted">Regularidade ao longo da corrida</div>
          </div>
        </div>

        <div class="mb-3 mt-2">
          <label class="form-label">Equipe</label>
          <select th:field="*{equipeId}" class="form-select">
            <option value="0">— Sem equipe —</option>
            <option th:each="e : ${equipes}" th:value="${e.id}" th:text="${e.nome}"></option>
          </select>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Cadastrar</button>
          <a th:href="@{/pilotos}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>

</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
