<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Automodelista — Pilotos</title>
  <th:block th:replace="~{fragments/layout :: head-assets}"></th:block>
</head>
<body>

<header th:replace="~{fragments/layout :: topbar}"></header>
<th:block th:replace="~{fragments/layout :: sidebar}"></th:block>

<main class="main">

  <div class="page-header">
    <div>
      <h1 class="page-title">Pilotos</h1>
      <p class="page-subtitle">Grid completo da temporada — pilotos de referência e seus pilotos.</p>
    </div>
    <a th:href="@{/pilotos/novo}" class="btn btn-primary">+ Novo Piloto</a>
  </div>

  <div class="alert alert-warning" th:if="${param.bloqueado}">
    Este piloto faz parte dos dados de referência do campeonato e não pode ser editado.
  </div>

  <div class="card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-sm mb-0">
          <thead>
            <tr>
              <th>Nº</th><th>Nome</th><th>Nacionalidade</th><th>Equipe</th>
              <th class="num">Hab.</th><th class="num">Cons.</th><th class="num">Pts</th><th></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="p : ${pilotos}">
              <td class="num" th:text="${p.numeroCarro}"></td>
              <td th:text="${p.nome}"></td>
              <td class="text-muted" th:text="${p.nacionalidade}"></td>
              <td class="text-muted" th:text="${equipeNomes.get(p.equipeId)}"></td>
              <td class="num" th:text="${p.habilidade}"></td>
              <td class="num" th:text="${p.consistencia}"></td>
              <td class="num"><strong th:text="${p.pontosCampeonato}"></strong></td>
              <td>
                <a th:if="${!p.bloqueado}" th:href="@{/pilotos/{id}/editar(id=${p.id})}" class="btn btn-sm btn-outline-secondary">Editar</a>
                <span th:if="${p.bloqueado}" class="badge badge--locked">🔒 Referência</span>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pilotos)}">
              <td colspan="8" class="text-muted text-center py-3">Nenhum piloto cadastrado.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
